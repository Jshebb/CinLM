[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cinlm"
version = "0.1.0"
description = "CinLM: Hybrid Attention + Engram + Sparse ReLU² MoE PT-BR Small Language Model, designed for Frontier-LLM mechanistic interpretability"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4.0",
    "tokenizers>=0.20.0",
    "datasets>=3.0.0",
    "numpy>=1.26.0",
    "safetensors>=0.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
